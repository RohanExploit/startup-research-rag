name: company_brain
description: Phone client for the Company Brain retrieval engine.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.2.2
  shared_preferences: 2.3.2
  speech_to_text: 6.6.2
  google_mlkit_text_recognition: 0.13.0
  image_picker: 1.1.2
  permission_handler: 11.3.1
  sqflite: 2.4.1
  path_provider: 2.1.5
  path: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  sqflite_common_ffi: 2.3.4+4

flutter:
  uses-material-design: true
