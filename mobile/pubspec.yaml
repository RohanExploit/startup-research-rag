name: company_brain
description: Phone client for the Company Brain retrieval engine.
publish_to: none
version: 1.0.0+1

environment:
  sdk: "^3.12.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.3
  path_provider: 2.1.6
  path: 1.9.1
  # On-device generation. Needs Dart >=3.12, which is why the CI Flutter
  # pin moved to 3.47.2 -- no earlier flutter_gemma supports .litertlm.
  flutter_gemma: 1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  sqflite_common_ffi: 2.4.2+1

flutter:
  uses-material-design: true
